<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TCC TV">
<meta name="description" content="TCC TV : le catch façon Netflix — PLE, shows hebdo, actu en français et communauté de fans.">
<title>TCC TV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>try{if(localStorage.getItem("ctv.start")==="tccg"&&(!location.hash||location.hash==="#/"||location.hash==="#"))location.replace("#/tccg");document.documentElement.classList.toggle("tgstart",localStorage.getItem("ctv.start")==="tccg");}catch(e){}</script>
<script>try{var m=localStorage.getItem("ctv.intro");if(m!=="off"&&!sessionStorage.getItem("ctv.introShown")){document.documentElement.classList.add("introon");setTimeout(function(){document.documentElement.classList.remove("introon")},6000)}}catch(e){}</script>
</head>
<body>
<div id="intro" aria-hidden="true"></div>
<header class="top">
  <a class="logo" href="#/" aria-label="TCC TV, accueil"><span class="l1">TCC</span><span class="l2">TV</span></a>
  <div class="hbtns">
    <button class="iconbtn editbtn" id="editbtn" data-act="editmode" aria-label="Mode modification (modo)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <a class="iconbtn srchbtn" id="srchbtn" href="#/recherche" aria-label="Recherche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
    <button class="iconbtn musicbtn" id="musicbtn" data-act="music" aria-label="Musique" hidden></button>
    <button class="iconbtn" id="notifbtn" data-act="notifs" aria-label="Notifications" hidden></button>
    <button class="iconbtn favbtn" id="favbtn" data-act="favs" aria-label="Mes favoris"></button>
  </div>
</header>
<div id="tabwrap"><div id="tabbg" aria-hidden="true"></div><div id="tabs"></div></div>
<div id="ticker" hidden></div>
<main id="app"><p class="empty">Chargement…</p></main>
<div id="foot"></div>
<nav class="bnav" id="bnav" aria-label="Navigation"></nav>
<script type="module" src="js/app.min.js"></script>
</body>
</html>
