# Robot TCC TV : toutes les 30 minutes, copie l'actu (flux RSS des sites français) et les vidéos des chaînes YouTube officielles
# dans data/feed.json. Gratuit (dépôt public), sans intelligence artificielle, sans clé à fournir.
name: Robot TCC TV (actu et vidéos)
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robot-tcc-tv
  cancel-in-progress: false
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Actu et vidéos
        run: node .github/scripts/robot.mjs
      - name: Envoi sur le dépôt
        run: |
          if git diff --quiet -- data/feed.json; then echo "Rien de neuf"; exit 0; fi
          git config user.name "TCC TV robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git commit -m "Robot TCC TV : actu et vidéos"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 7
          done
          exit 1
