# Installe (et met à jour) le service Cloudflare des notifications instantanées TCC TV : messages privés, feuds, annonces.
# Il suffit d'ajouter une fois les secrets du dépôt : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID et FIREBASE_SA.
# Ensuite : « Run workflow » ici, ou automatiquement à chaque modification du dossier cloudflare/.
# L'adresse du service est enregistrée dans data/push.json, que l'app lit toute seule.
name: Notifications TCC TV (service Cloudflare)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloudflare/**", ".github/workflows/push-worker.yml"]
permissions:
  contents: write
concurrency:
  group: push-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installation sur Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$FIREBASE_SA" ]; then
            echo "Il manque les secrets CLOUDFLARE_API_TOKEN et/ou FIREBASE_SA : rien à installer pour l'instant."; exit 0
          fi
          cd cloudflare
          npx --yes wrangler@3 deploy 2>&1 | tee deploy.log
          printf '%s' "$FIREBASE_SA" | npx --yes wrangler@3 secret put FIREBASE_SA
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "Adresse du service introuvable (voir le journal ci-dessus)"; exit 1; fi
          echo "URL=$URL" >> "$GITHUB_ENV"
      - name: Adresse du service dans l'app
        if: env.URL != ''
        run: |
          node -e 'const fs=require("fs");let j={};try{j=JSON.parse(fs.readFileSync("data/push.json","utf8"))}catch(e){}j.url=process.env.URL;fs.writeFileSync("data/push.json",JSON.stringify(j,null,1)+"\n")' 
          if [ -z "$(git status --porcelain -- data/push.json)" ]; then echo "Adresse inchangée"; exit 0; fi
          git config user.name "TCC TV robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/push.json
          git commit -m "Notifications TCC TV : adresse du service"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 7
          done
          exit 1
